# RetailPulse configuration — single source for dates, seed and data source.
seed: 42
cutoff: "2011-09-09"     # features use ONLY data strictly before this date
horizon_days: 90         # label window: [cutoff, cutoff + horizon_days)

stats:
  alpha: 0.05
  year1: ["2009-12-01", "2010-12-01"]   # [start, end): Y1 = 2009-12-01 -> 2010-11-30
  year2: ["2010-12-01", "2011-12-01"]   # [start, end): Y2 = 2010-12-01 -> 2011-11-30

data:
  url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
  xlsx_name: "online_retail_II.xlsx"

# ---- P3 models ----
segment:
  # K-Means inputs: the 6 easy-to-explain features (P6a). Excluded but kept in the profiles:
  # mean_interpurchase_days (~ tenure / frequency), return_rate (zero-inflated), non_uk_share
  # (would make the segment x UK chi-square circular)
  features: [recency, frequency, monetary, tenure, avg_basket_value, n_distinct_products]
  k_range: [2, 10]          # k scanned for the elbow / silhouette / DB / CH table
  k_choice_range: [3, 7]    # k considered by the automatic choice rule (+ ARI stability)
  k: null                   # null = automatic rule; set an int to override
  names: {}                 # {} = automatic naming rule; override e.g. {0: "Champions", 1: ...}

predict:
  features: [recency, frequency, monetary, tenure, avg_basket_value, n_distinct_products]
  models: [logistic, knn, naive_bayes]   # trained + compared (subset of contracts.ALL_CLASSIFIERS)
  train_offset_days: 90     # train snapshot = cutoff - 90 days (labels end at the real cutoff)
  cv_folds: 5
  knn_k_max: 100
  qda_reg_param: 0.01

rules:
  top_n_products: 500
  min_support: 0.01
  min_abs_invoices: 30      # support floor = max(min_support, min_abs_invoices / n_invoices)
  min_confidence: 0.3
  max_len: 3
  max_rules_per_scope: 200
  n_recommend: 5
  per_segment: false        # false = overall rules + overall best sellers only (no segment scopes)
