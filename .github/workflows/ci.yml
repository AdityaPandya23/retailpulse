# Free GitHub Actions CI: lint + tests on every push / PR.
# Tests use the synthetic fixture and the tracked artifacts/mock only; data/ is never needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0 ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
